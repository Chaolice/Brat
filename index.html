<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glassmorphism Login Form</title>

  <link rel="stylesheet" href="indexStyle.css" />

<body>

  <div class="popupBox">

    <img class="ratHouse" src="imgs/Rat_Cage.png">
    <p class="ratSentence">Jailed for having eaten X amount of pixels</p>

    <!-- From Uiverse.io by FColombati, such a satisfying button!-->

    <button class="button buttonAdd" onclick="saveDistractingSite()">
      <div class=" button-outer">
        <div class="button-inner">
          <p>Add page</p>
        </div>
      </div>
    </button>
    <button class="button buttonRemove" onclick="removePage()">
      <div class=" button-outer">
        <div class="button-inner">
          <p>Remove page</p>
        </div>
      </div>

    </button>
    <!-- From Uiverse.io by mobinkakei, yummy locking animation!-->
    <input id="inpLock" type="checkbox">
    <label class="btn-lock button-inner" for="inpLock">
      <svg width="36" height="40" viewBox="0 0 36 40">
        <path class="lockb"
          d="M27 27C27 34.1797 21.1797 40 14 40C6.8203 40 1 34.1797 1 27C1 19.8203 6.8203 14 14 14C21.1797 14 27 19.8203 27 27ZM15.6298 26.5191C16.4544 25.9845 17 25.056 17 24C17 22.3431 15.6569 21 14 21C12.3431 21 11 22.3431 11 24C11 25.056 11.5456 25.9845 12.3702 26.5191L11 32H17L15.6298 26.5191Z">
        </path>
        <path class="lock" d="M6 21V10C6 5.58172 9.58172 2 14 2V2C18.4183 2 22 5.58172 22 10V21"></path>
        <path class="bling" d="M29 20L31 22"></path>
        <path class="bling" d="M31.5 15H34.5"></path>
        <path class="bling" d="M29 10L31 8"></path>
      </svg>
    </label>

    <script src="js/siteBlocker.js"></script>
    <script src="js/popup.js"></script>
  </div>


</body>

</html>
